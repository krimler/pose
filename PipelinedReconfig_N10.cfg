\* TLC configuration for PipelinedReconfig module, N=10
\*
\* MaxSteps bounds the exploration depth. The key theorems only need
\* MaxSteps=3 (2-hop paths). State-space at N=10:
\*   MaxSteps=3: 375 states     MaxSteps=5: 554K states
\*   MaxSteps=6+: >5M states (history variable causes explosion)
CONSTANT
    N = 10
    MaxSteps = 5
SPECIFICATION Spec
INVARIANT
    SafetyInvariant
    FirstStepBottleneck
    CompletionRequiresMaxW
    MinCostAchieved
PROPERTY Liveness
